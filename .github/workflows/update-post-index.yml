name: Update Post Index

on:
  push:
    branches:
      - main
    paths:
      - "blog/posts/**/*.md"
      - "memrise/posts/**/*.md"
      - "gist/posts/**/*.md"
      - "scripts/generate-post-index.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate index files
        run: |
          node scripts/generate-post-index.mjs blog/posts
          node scripts/generate-post-index.mjs memrise/posts
          node scripts/generate-post-index.mjs gist/posts

      - name: Commit updated indexes
        run: |
          if git diff --quiet -- blog/posts/index.json memrise/posts/index.json gist/posts/index.json blog/feed.xml memrise/feed.xml gist/feed.xml; then
            echo "No index updates required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/posts/index.json memrise/posts/index.json gist/posts/index.json blog/feed.xml memrise/feed.xml gist/feed.xml
          git commit -m "chore: refresh post indexes"
          git push
